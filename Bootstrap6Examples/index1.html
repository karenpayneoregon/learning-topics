
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1" />

    <title>Volume Range Dialog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
          crossorigin="anonymous">

    <script src="lib/debugHelper.js"></script>

    <link rel="shortcut icon" href="#">
</head>
<body>

    <main>
        <div class="container">
            <div style="max-width: 40em;margin-top: 20em">

                <div class="form-field">

                    <label for="rangeField" class="form-label">
                        Volume
                    </label>

                    <div class="form-range" data-bs-bubble>
                        <input type="range"
                               class="form-range-input"
                               id="rangeField"
                               min="0"
                               max="100"
                               step="1"
                               value="50">
                    </div>

                    <small class="form-text">
                        Adjust the volume level.
                    </small>

                    <div class="mt-3">
                        <button type="button"
                                id="showVolumeButton"
                                class="btn btn-solid theme-primary"
                                data-bs-toggle="dialog"
                                data-bs-target="#volumeDialog">
                            Show Volume
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 6 Dialog -->
    <dialog class="dialog"
            id="volumeDialog"
            aria-labelledby="volumeDialogLabel">

        <div class="dialog-header">
            <h2 class="dialog-title fs-5"
                id="volumeDialogLabel">
                Current Volume
            </h2>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="dialog"
                    aria-label="Close">
            </button>
        </div>

        <div class="dialog-body">
            Volume level:
            <strong id="volumeValue">50</strong>
        </div>

        <div class="dialog-footer">
            <button type="button"
                    class="btn btn-solid theme-secondary"
                    data-bs-dismiss="dialog">
                Close
            </button>
        </div>

    </dialog>

    <script type="module"
            src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            document.addEventListener("keydown", (event) => {

                if (event.key === "1" &&
                    event.altKey &&
                    event.ctrlKey) {

                    $debugHelper.toggle(true);
                }

            });

            const rangeField = document.getElementById("rangeField");

            const volumeDialog = document.getElementById("volumeDialog");

            const volumeValue = document.getElementById("volumeValue");

            volumeDialog.addEventListener("show.bs.dialog", () => {
                volumeValue.textContent = rangeField.value;
            });

        });
    </script>

</body>
</html>
