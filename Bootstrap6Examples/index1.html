
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1" />

    <title>Volume Range Modal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" />

    <script src="lib/debugHelper.js"></script>

    <link rel="shortcut icon" href="#">
</head>
<body>

    <main>
        <div class="container">
            <div class="mt-5" style="width: 20em;">

                <div class="form-field">
                    <label for="rangeField" class="form-label">
                        Volume
                    </label>

                    <input type="range"
                           class="form-range"
                           id="rangeField"
                           min="0"
                           max="100"
                           value="50">

                    <small class="form-text">
                        Adjust the volume level.
                    </small>

                    <div class="mt-3">
                        <button type="button"
                                id="showVolumeButton"
                                class="btn btn-primary"
                                data-bs-toggle="modal"
                                data-bs-target="#volumeModal">
                            Show Volume
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Volume Modal -->
    <div class="modal fade"
         id="volumeModal"
         tabindex="-1"
         aria-labelledby="volumeModalLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="volumeModalLabel">
                        Current Volume
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>
                </div>

                <div class="modal-body">
                    Volume level:
                    <strong id="volumeValue"></strong>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Close
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            document.addEventListener("keydown", (event) => {
                if (event.key === "1" &&
                    event.altKey &&
                    event.ctrlKey) {

                    $debugHelper.toggle(true);
                }
            });

            const volumeModal =
                document.getElementById("volumeModal");

            volumeModal.addEventListener("show.bs.modal", () => {

                const rangeField =
                    document.getElementById("rangeField");

                document.getElementById("volumeValue").textContent =
                    rangeField.value;
            });

        });
    </script>

</body>
</html>
